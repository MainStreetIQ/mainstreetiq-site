name: Scheduled blog publish

# Promotes "After the Close" posts from _scheduled/atc/ into blog/ on their slot
# dates, then commits to main so Vercel deploys them. See _scripts/publish_scheduled.py
# and _scheduled/atc/manifest.json. Idempotent: a no-op on days with nothing due.

on:
  schedule:
    # 16:15 UTC daily = after the 08:00 local LinkedIn posts fire year-round
    # (08:15 PST in winter, 09:15 PDT in summer).
    - cron: "15 16 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override publish date (YYYY-MM-DD). Blank = today (UTC)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scheduler
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python3 _scripts/publish_scheduled.py --date "${{ github.event.inputs.date }}"
          else
            python3 _scripts/publish_scheduled.py
          fi

      - name: Commit and push if anything was published
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing due today. No changes to commit."
            exit 0
          fi
          git config user.name "msiq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore(blog): publish scheduled After the Close post(s) for $(date -u +%Y-%m-%d)"
          git push
