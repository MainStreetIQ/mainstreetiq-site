name: Scheduled blog publish

# Promotes scheduled posts (After the Close + the AI-visibility "Found by the
# Machine" track) from _scheduled/<series>/ into blog/ on their slot dates, then
# commits to main so the site deploys them. See _scripts/publish_scheduled.py and
# the per-series manifest.json files. Idempotent: a no-op on days with nothing due.

on:
  schedule:
    # 15:00 UTC daily targets ~08:00 local when the Thursday LinkedIn posts fire
    # (08:00 PDT in summer, 07:00 PST in winter). GitHub may run scheduled jobs a
    # few minutes-to-an-hour late, so treat this as "Thursday morning," not exact.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Override publish date (YYYY-MM-DD). Blank = today (UTC)."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scheduler
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python3 _scripts/publish_scheduled.py --date "${{ github.event.inputs.date }}"
          else
            python3 _scripts/publish_scheduled.py
          fi

      - name: Commit and push if anything was published
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing due today. No changes to commit."
            exit 0
          fi
          git config user.name "msiq-bot"
          git config user.email "actions@users.noreply.github.com"
          # publish_scheduled.py only ever writes blog/*.html, llms.txt and the
          # marker-delimited blocks of sitemap.xml — stage exactly those so stray
          # working-tree files can never be swept into prod. sitemap.xml MUST be
          # here: it was omitted until 2026-08-03, which left every one of the 12
          # posts this Action had ever published absent from the sitemap.
          git add blog/ llms.txt sitemap.xml
          git commit -m "chore(blog): publish scheduled post(s) for $(date -u +%Y-%m-%d)"
          git push
